<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-label="Excursii: un microbuz pe un drum de țară, cu dealuri și copaci în spate">
  <rect width="400" height="240" fill="#fbdcd4"/>

  <!-- soare -->
  <circle cx="340" cy="46" r="26" fill="#f2a11c" opacity="0.85"/>

  <!-- dealuri -->
  <path d="M0 150c54-26 96-8 148-14 52-6 92-22 148-10 40 9 70 6 104-4v118H0Z" fill="#276e33" opacity="0.45"/>
  <path d="M0 172c60-22 108-2 166-8 58-6 100-18 154-6 32 7 56 6 80 0v82H0Z" fill="#3f9e4d"/>

  <!-- copaci -->
  <g>
    <rect x="34" y="150" width="10" height="46" rx="3" fill="#7a5233"/>
    <path d="M39 84l26 44H13Z" fill="#276e33"/>
    <path d="M39 110l30 48H9Z" fill="#276e33"/>
    <rect x="356" y="158" width="8" height="38" rx="3" fill="#7a5233"/>
    <path d="M360 112l20 34h-40Z" fill="#276e33"/>
    <path d="M360 132l23 36h-46Z" fill="#276e33"/>
  </g>

  <!-- drumul -->
  <rect y="192" width="400" height="48" fill="#e7dcc5"/>
  <g fill="#f8f3e8">
    <rect x="18" y="214" width="34" height="5" rx="2.5"/>
    <rect x="86" y="214" width="34" height="5" rx="2.5"/>
    <rect x="154" y="214" width="34" height="5" rx="2.5"/>
    <rect x="222" y="214" width="34" height="5" rx="2.5"/>
    <rect x="290" y="214" width="34" height="5" rx="2.5"/>
    <rect x="358" y="214" width="30" height="5" rx="2.5"/>
  </g>

  <!-- bagaje pe plafon -->
  <rect x="118" y="120" width="74" height="9" rx="3" fill="#a7794e"/>
  <rect x="126" y="106" width="26" height="16" rx="4" fill="#c9a06a"/>
  <rect x="158" y="110" width="22" height="12" rx="4" fill="#7fa6c3"/>

  <!-- microbuzul -->
  <g>
    <rect x="96" y="129" width="192" height="56" rx="12" fill="#d6382a"/>
    <rect x="110" y="140" width="42" height="26" rx="5" fill="#dbebfb"/>
    <rect x="160" y="140" width="42" height="26" rx="5" fill="#dbebfb"/>
    <rect x="210" y="140" width="34" height="26" rx="5" fill="#dbebfb"/>
    <path d="M252 140h20a10 10 0 0 1 10 10v16h-30Z" fill="#dbebfb"/>
    <rect x="96" y="170" width="192" height="7" fill="#f2a11c"/>
    <circle cx="284" cy="152" r="4" fill="#f8f3e8"/>
    <!-- copii la geam -->
    <circle cx="126" cy="156" r="7" fill="#8a5c3d"/>
    <circle cx="176" cy="156" r="7" fill="#e9c6a1"/>
    <circle cx="224" cy="156" r="7" fill="#c78f5f"/>
  </g>

  <!-- roți -->
  <g>
    <circle cx="134" cy="188" r="14" fill="#17213f"/>
    <circle cx="134" cy="188" r="5.5" fill="#e7dcc5"/>
    <circle cx="252" cy="188" r="14" fill="#17213f"/>
    <circle cx="252" cy="188" r="5.5" fill="#e7dcc5"/>
  </g>

  <!-- rucsac uitat pe marginea drumului -->
  <g transform="translate(318 186)">
    <rect x="0" y="8" width="26" height="30" rx="8" fill="#276e33"/>
    <path d="M7 8V5a6 6 0 0 1 12 0v3" fill="none" stroke="#313c66" stroke-width="3"/>
    <rect x="4" y="20" width="18" height="9" rx="3" fill="#f2a11c"/>
  </g>
</svg>
