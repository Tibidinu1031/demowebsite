<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-label="Hollow Club: a workbench with tools, a chessboard and a guitar">
  <rect width="400" height="240" fill="#d8e5ee"/>
  <!-- pegboard -->
  <rect x="220" y="18" width="158" height="104" rx="6" fill="#e7dcc5"/>
  <g fill="#c9b89a">
    <circle cx="238" cy="34" r="2.5"/><circle cx="262" cy="34" r="2.5"/><circle cx="286" cy="34" r="2.5"/>
    <circle cx="310" cy="34" r="2.5"/><circle cx="334" cy="34" r="2.5"/><circle cx="358" cy="34" r="2.5"/>
    <circle cx="238" cy="60" r="2.5"/><circle cx="262" cy="60" r="2.5"/><circle cx="286" cy="60" r="2.5"/>
    <circle cx="310" cy="60" r="2.5"/><circle cx="334" cy="60" r="2.5"/><circle cx="358" cy="60" r="2.5"/>
    <circle cx="238" cy="86" r="2.5"/><circle cx="262" cy="86" r="2.5"/><circle cx="286" cy="86" r="2.5"/>
    <circle cx="310" cy="86" r="2.5"/><circle cx="334" cy="86" r="2.5"/><circle cx="358" cy="86" r="2.5"/>
  </g>
  <!-- hanging tools -->
  <g>
    <path d="M244 40v42" stroke="#a7794e" stroke-width="6" stroke-linecap="round"/>
    <path d="M232 42h24l-4 12h-16Z" fill="#6b7d71"/>
    <path d="M288 38v46" stroke="#c9a06a" stroke-width="5" stroke-linecap="round"/>
    <path d="M278 36h20v10h-20Z" fill="#6b7d71"/>
    <path d="M330 40l18 34" stroke="#a7794e" stroke-width="5" stroke-linecap="round"/>
    <path d="M326 36a7 7 0 1 1 10 8Z" fill="#6b7d71"/>
  </g>
  <!-- guitar -->
  <g transform="translate(24 34)">
    <path d="M28 6h8v72h-8Z" fill="#a7794e"/>
    <path d="M24 0h16v14H24Z" fill="#7a5233"/>
    <path d="M32 78c-20 0-32 12-32 30 0 14 8 24 18 24 8 0 10-6 14-6s6 6 14 6c10 0 18-10 18-24 0-18-12-30-32-30Z" fill="#c9a06a"/>
    <circle cx="32" cy="112" r="9" fill="#7a5233"/>
    <g stroke="#8c6340" stroke-width="1.2">
      <path d="M28 78v54M32 78v54M36 78v54"/>
    </g>
  </g>
  <!-- bench -->
  <rect x="16" y="176" width="360" height="14" rx="4" fill="#c9a06a"/>
  <path d="M40 190v42M352 190v42" stroke="#a7794e" stroke-width="11" stroke-linecap="round"/>
  <!-- chessboard -->
  <g transform="translate(214 138)">
    <rect width="112" height="38" rx="3" fill="#f8f3e8"/>
    <g fill="#3b4d43">
      <rect x="14" width="14" height="38"/><rect x="42" width="14" height="38"/>
      <rect x="70" width="14" height="38"/><rect x="98" width="14" height="38"/>
    </g>
    <rect width="112" height="38" rx="3" fill="none" stroke="#a7794e" stroke-width="3"/>
    <!-- two pieces -->
    <path d="M32 20c-4 0-6-3-6-6s2-5 5-6c-2-2-2-6 1-6s4 4 2 6c3 1 5 3 5 6s-3 6-7 6Z" fill="#c05f38"/>
    <path d="M26 20h14l3 10H23Z" fill="#c05f38"/>
    <path d="M78 22c-5 0-8-4-8-8 0-4 3-6 6-7-2-3-1-7 2-7s4 4 2 7c3 1 6 3 6 7 0 4-3 8-8 8Z" fill="#1d2b23"/>
    <path d="M70 22h16l3 8H67Z" fill="#1d2b23"/>
  </g>
  <!-- jar of pencils -->
  <g transform="translate(122 128)">
    <path d="M4 22h34l-4 26H8Z" fill="#f8f3e8" opacity="0.9"/>
    <path d="M10 22V4M18 22V0M26 22V6M34 22V2" stroke="#c05f38" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 22V0" stroke="#7fa6c3" stroke-width="4" stroke-linecap="round"/>
    <path d="M34 22V2" stroke="#e2a641" stroke-width="4" stroke-linecap="round"/>
    <path d="M4 22h34" stroke="#d9cbaf" stroke-width="3"/>
  </g>
</svg>
